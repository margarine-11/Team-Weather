<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="card">
        <h1 class="card_title">Weather app</h1>
        <p class="card_date">Today, <span id="date"></span></p>
        <div class="card_search">
            <input type="text" class="card_input" placeholder="Enter city name">
            <button id="searchBtn" class="card_btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>    
        <div class="card_weather">
            <h2 class="card_title card_title--city" id="city">Norilsk</h2>
            <div class="card_block">
                <h3 class="card_title card_title--temp" id="temperature">22°C</h3>
                <img src="" class="card_weather-icon" alt="icon">
            </div>
        </div>
        <div class="card_details">
            <div class="card_col">
                <i class="fa-solid fa-wind"></i>
                <p>wind</p>
                <p id="wind" class="card_info">10 m/s</p>
            </div>
            <div class="card_col">
                <i class="fa-solid fa-droplet"></i>
                <p>hum</p>
                <p id="humidity" class="card_info">80%</p>
            </div>
        </div>      
    </div>    
    <script src="script.js"></script>
</body>
</html>
